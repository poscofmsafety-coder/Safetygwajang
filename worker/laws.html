<style>
.law-page{max-width:1240px;margin:0 auto;padding:34px 22px 70px}.law-hero{padding:28px;border:1px solid #dbe4e7;border-radius:22px;background:linear-gradient(135deg,#fff,#f1f8f6);box-shadow:0 8px 26px rgba(21,59,103,.05)}.law-hero .eyebrow{color:#0b8185;font-weight:900;font-size:.72rem;letter-spacing:.08em}.law-hero h1{margin:7px 0 8px;color:#153b67;font-size:2rem}.law-hero p{margin:0;color:#657688;line-height:1.8;font-size:.9rem}.law-search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}.law-search input{height:54px;border:1px solid #cad8df;border-radius:14px;padding:0 17px;font-size:1rem;background:#fff}.law-search button{border:0;border-radius:14px;background:#0b8185;color:#fff;padding:0 26px;font-weight:900;cursor:pointer}.law-search button:hover{background:#096b70}.law-status{margin-top:10px;font-size:.76rem;color:#657688}.law-status.ok{color:#087c59}.law-status.bad{color:#b5463c}.law-results{display:none;margin-top:28px}.law-results.show{display:block}.law-group{margin-top:25px}.law-group-head{display:flex;align-items:center;gap:9px;border-bottom:1px solid #dbe4e7;padding-bottom:10px}.law-group-head h2{margin:0;color:#153b67;font-size:1.2rem}.law-count{display:inline-flex;min-width:28px;height:25px;align-items:center;justify-content:center;padding:0 8px;border-radius:999px;background:#153b67;color:#fff;font-size:.72rem;font-weight:900}.law-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.law-card{display:block;border:1px solid #dce5e8;border-radius:16px;padding:17px;background:#fff;text-decoration:none;color:inherit;transition:.16s}.law-card:hover{transform:translateY(-2px);border-color:#8fb9b9;box-shadow:0 8px 20px rgba(21,59,103,.07)}.law-badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf7f5;color:#0b8185;font-size:.68rem;font-weight:900}.law-card h3{margin:9px 0 7px;color:#183a61;font-size:.94rem;line-height:1.55}.law-card p{margin:0;color:#697a8b;font-size:.78rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.law-fallback{margin-top:20px;padding:16px;border:1px solid #eadcaa;border-radius:14px;background:#fffaf0;color:#746743;font-size:.8rem;line-height:1.7}.law-fallback a{font-weight:900;color:#153b67}.empty{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed #d2dee3;border-radius:15px;background:#fff;color:#7b8997}@media(max-width:760px){.law-page{padding:22px 14px 50px}.law-hero{padding:21px 17px}.law-hero h1{font-size:1.55rem}.law-search{grid-template-columns:1fr}.law-search button{height:48px}.law-grid{grid-template-columns:1fr}}
</style>

<main class="law-page">
<section class="law-hero">
<span class="eyebrow">SMART SAFETY LAW SEARCH</span>
<h1>스마트 안전보건법령 검색</h1>
<p>산업안전보건법·시행령·시행규칙·안전보건규칙·고시와 KOSHA GUIDE를 한 번에 검색합니다.</p>
<div class="law-search"><input id="searchInput" autocomplete="off" placeholder="검색어 입력 (예: 난간, 관리감독자, 황산, 작업환경측정)"><button id="searchBtn" type="button">검색</button></div>
<div id="dbStatus" class="law-status">KOSHA 공공데이터 연결 상태 확인 중…</div>
</section>
<section id="resultArea" class="law-results" aria-live="polite">
<div class="law-group"><div class="law-group-head"><h2>산업안전보건법 및 관계 법령</h2><span id="cntLaw" class="law-count">0</span></div><div id="lawContent" class="law-grid"></div></div>
<div class="law-group"><div class="law-group-head"><h2>KOSHA GUIDE 및 안전보건 자료</h2><span id="cntGuide" class="law-count">0</span></div><div id="guideContent" class="law-grid"></div></div>
<div id="fallback" class="law-fallback" hidden></div>
</section>
</main>
<script>
const CAT_GUIDE=new Set(['6','7']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function officialLink(item,q){
  const raw=String(item.url||'').trim(); if(/^https?:\/\//i.test(raw))return raw;
  if(CAT_GUIDE.has(String(item.category))) return 'https://portal.kosha.or.kr/archive/resources/tech-support/search/all?page=1&rowsPerPage=10&keyword='+encodeURIComponent(q);
  return 'https://www.law.go.kr/lsSc.do?query='+encodeURIComponent(item.title||q);
}
function renderCards(id,items,q){const el=document.getElementById(id);if(!items.length){el.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}el.innerHTML=items.map(x=>`<a class="law-card" href="${esc(officialLink(x,q))}" target="_blank" rel="noopener noreferrer"><span class="law-badge">${esc(x.categoryName||'안전보건 자료')}</span><h3>${esc(x.title||q+' 검색 결과')}</h3><p>${esc(x.content||'원문에서 상세 내용을 확인하세요.')}</p></a>`).join('')}
async function health(){const el=document.getElementById('dbStatus');try{const h=await fetch('/api/health',{cache:'no-store'}),hj=await h.json();if(!h.ok||!hj.lawSearchConfigured)throw new Error('KOSHA_LAW_API_KEY 또는 KOSHA_API_KEY Secret을 확인해 주세요.');const r=await fetch('/api/laws/search?q='+encodeURIComponent('안전난간')+'&limit=1',{cache:'no-store'}),j=await r.json();if(r.ok&&j.ok){el.textContent='KOSHA 스마트 법령검색 API 연결됨';el.className='law-status ok'}else throw new Error(j.error||'스마트검색 활용신청 상태를 확인해 주세요.')}catch(e){el.textContent='법령 API 확인 필요 · '+String(e.message||e);el.className='law-status bad'}}
async function doSearch(){const q=document.getElementById('searchInput').value.trim();if(!q){document.getElementById('searchInput').focus();return}const btn=document.getElementById('searchBtn'),status=document.getElementById('dbStatus');btn.disabled=true;btn.textContent='검색 중';status.textContent='KOSHA 스마트 검색에서 최신 자료를 조회하고 있습니다…';status.className='law-status';document.getElementById('resultArea').classList.add('show');try{const r=await fetch('/api/laws/search?q='+encodeURIComponent(q),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'검색 실패');const all=j.items||[],laws=all.filter(x=>!CAT_GUIDE.has(String(x.category))),guides=all.filter(x=>CAT_GUIDE.has(String(x.category)));document.getElementById('cntLaw').textContent=laws.length;document.getElementById('cntGuide').textContent=guides.length;renderCards('lawContent',laws,q);renderCards('guideContent',guides,q);status.textContent=`검색 완료 · 총 ${all.length}건`;status.className='law-status ok';document.getElementById('fallback').hidden=true}catch(e){document.getElementById('cntLaw').textContent='-';document.getElementById('cntGuide').textContent='-';document.getElementById('lawContent').innerHTML='<div class="empty">KOSHA API 결과를 불러오지 못했습니다.</div>';document.getElementById('guideContent').innerHTML='<div class="empty">연결을 확인한 뒤 다시 검색해 주세요.</div>';const f=document.getElementById('fallback');f.hidden=false;f.innerHTML=`API 오류: ${esc(e.message)}<br><a target="_blank" rel="noopener" href="https://www.law.go.kr/lsSc.do?query=${encodeURIComponent(q)}">국가법령정보센터에서 직접 검색</a> · <a target="_blank" rel="noopener" href="https://portal.kosha.or.kr/archive/resources/tech-support/search/all?page=1&rowsPerPage=10">KOSHA GUIDE 검색</a>`;status.textContent='KOSHA API 연결 확인 필요';status.className='law-status bad'}finally{btn.disabled=false;btn.textContent='검색'}}
document.getElementById('searchBtn').addEventListener('click',doSearch);document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});health();
</script>
<script src="../js/site-clock.js"></script><script src="../js/mascot-cheer.js"></script>
</body></html>
